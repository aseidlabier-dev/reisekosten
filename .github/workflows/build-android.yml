name: Reisekosten Android APK bauen

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Grund fuer den Build'
        required: false
        default: 'Manueller Build'

jobs:
  build-android:
    name: APK erstellen
    runs-on: ubuntu-latest

    steps:
      # 1. Code laden
      - name: Code auschecken
        uses: actions/checkout@v4

      # 2. Node.js 20 einrichten
      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. npm-Pakete installieren (Capacitor)
      - name: npm-Abhaengigkeiten installieren
        run: npm install

      # 4. Java 17 einrichten (fuer Android Gradle)
      - name: Java 17 (Temurin) einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 5. Android SDK sicherstellen
      - name: Android SDK Komponenten installieren
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" || true
          echo "Android SDK bereit."

      # 6. Android-Plattform hinzufuegen
      - name: Capacitor Android-Plattform hinzufuegen
        run: npx cap add android

      # 7. Web-Assets in Android-Projekt synchronisieren
      - name: Capacitor synchronisieren
        run: npx cap sync android

      # 8. Ausfuehrungsrechte fuer Gradle setzen
      - name: Gradle ausfuehrbar machen
        run: chmod +x android/gradlew

      # 9. Debug-APK bauen
      - name: Debug-APK bauen
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # 10. APK als Download-Artefakt bereitstellen (30 Tage verfuegbar)
      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Reisekosten-App-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 11. Zusammenfassung ausgeben
      - name: Build-Zusammenfassung
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -sh "$APK_PATH" | cut -f1)
            echo "✅ Reisekosten APK erfolgreich erstellt!"
            echo "   Groesse: $SIZE"
            echo "   → Jetzt im Tab 'Actions' unter 'Artifacts' herunterladen"
          else
            echo "❌ APK wurde nicht gefunden!"
            exit 1
          fi
