name: Reisekosten Android APK bauen

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Grund fuer den Build'
        required: false
        default: 'Manueller Build'

jobs:
  build-android:
    name: APK erstellen
    runs-on: ubuntu-latest

    steps:
      # 1. Code laden
      - name: Code auschecken
        uses: actions/checkout@v4

      # 2. Node.js 20 einrichten
      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. npm-Pakete installieren (Capacitor)
      - name: npm-Abhaengigkeiten installieren
        run: npm install

      # 4. Java 17 einrichten (fuer Android Gradle)
      - name: Java 17 (Temurin) einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 5. Android SDK sicherstellen
      - name: Android SDK Komponenten installieren
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "Android SDK bereit."

      # 6. Android-Plattform hinzufuegen
      - name: Capacitor Android-Plattform hinzufuegen
        run: npx cap add android

      # 7. Web-Assets in Android-Projekt synchronisieren
      - name: Capacitor synchronisieren
        run: npx cap sync android

      # 8. Eigenes App-Icon (icon.png) in alle Android-Aufloesungen einbinden
      - name: Eigenes App-Icon einbinden
        run: |
          python3 -c '
          import os
          from PIL import Image

          icon_src = "www/icon.png"
          if os.path.exists(icon_src):
              im = Image.open(icon_src).convert("RGBA")
              sizes = {
                  "mipmap-mdpi": (48, 108),
                  "mipmap-hdpi": (72, 162),
                  "mipmap-xhdpi": (96, 216),
                  "mipmap-xxhdpi": (144, 324),
                  "mipmap-xxxhdpi": (192, 432),
              }
              for folder, (size, fg_size) in sizes.items():
                  res_dir = os.path.join("android/app/src/main/res", folder)
                  os.makedirs(res_dir, exist_ok=True)
                  icon_resized = im.resize((size, size), Image.Resampling.LANCZOS)
                  icon_resized.save(os.path.join(res_dir, "ic_launcher.png"))
                  icon_resized.save(os.path.join(res_dir, "ic_launcher_round.png"))
                  fg = Image.new("RGBA", (fg_size, fg_size), (0, 0, 0, 0))
                  inner_size = int(fg_size * 0.72)
                  inner_im = im.resize((inner_size, inner_size), Image.Resampling.LANCZOS)
                  offset = (fg_size - inner_size) // 2
                  fg.paste(inner_im, (offset, offset), inner_im)
                  fg.save(os.path.join(res_dir, "ic_launcher_foreground.png"))
              print("✅ Eigenes App-Icon (icon.png) erfolgreich in alle Android-Aufloesungen integriert!")
          else:
              print("⚠️ www/icon.png nicht gefunden!")
          '

      # 9. Ausfuehrungsrechte fuer Gradle setzen
      - name: Gradle ausfuehrbar machen
        run: chmod +x android/gradlew

      # 9. Debug-APK bauen
      - name: Debug-APK bauen
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 10. APK als Download-Artefakt bereitstellen (30 Tage verfuegbar)
      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Reisekosten-App-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 11. Zusammenfassung ausgeben
      - name: Build-Zusammenfassung
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -sh "$APK_PATH" | cut -f1)
            echo "✅ Reisekosten APK erfolgreich erstellt!"
            echo "   Groesse: $SIZE"
            echo "   → Jetzt im Tab 'Actions' unter 'Artifacts' herunterladen"
          else
            echo "❌ APK wurde nicht gefunden!"
            exit 1
          fi
